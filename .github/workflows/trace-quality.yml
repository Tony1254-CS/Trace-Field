name: TRACE application checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: trace-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test, and build TRACE
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build frontend and API
        run: npm run build
